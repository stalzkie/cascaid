[project]
name = "cascaid"
version = "0.1.0"
description = "Predictive cascading-failure intelligence for AI-native systems"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "torch>=2.3",
    "torch-geometric>=2.5",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.11.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "litellm>=1.98.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascaid", "src/cascaid_demo"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
markers = [
    "integration: exercises multiple modules wired together on a real (not hand-built) run",
    "e2e: invokes the actual CLI entry points end-to-end",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
