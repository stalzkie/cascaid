name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - name: Generate synthetic fault-injection corpus
        run: uv run python -m cascaid_demo.run_scenarios
      - name: Train GNN and save pretrained artifact
        run: uv run python -m cascaid.train
      - name: Publish GitHub Release with pretrained artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            models/pretrained_base.pt \
            --title "${{ github.ref_name }}" \
            --generate-notes
